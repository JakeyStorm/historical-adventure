services:
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      DATA_DIR: /app/data
    expose:
      - "3000"
    volumes:
      - video_data:/app/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./${CADDY_CONFIG:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  video_data:
  caddy_data:
  caddy_config:
